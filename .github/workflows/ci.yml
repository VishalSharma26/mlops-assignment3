
name: CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install scikit-learn joblib

      - name: Train model
        run: python train.py

      - name: Build Docker image
        run: docker build -t g24ai1063/mlops-housing:v1 .

      - name: Run container and verify
        run: docker run g24ai1063/mlops-housing:v1

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to DockerHub
        run: docker push g24ai1063/mlops-housing:v1
